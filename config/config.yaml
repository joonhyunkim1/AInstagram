# 세부 주제는 아직 미확정 - 여기서만 고치면 전체 파이프라인에 반영되도록 구성
instagram:
  account_name: "_daily.ai_"
  business_account_id: ""      # Meta Graph API에서 발급받은 IG 유저 ID

posting:
  timezone: "Asia/Seoul"
  times: ["07:00", "12:00", "18:00", "23:00"]
  images_per_post:
    min: 2
    max: 6                        # 내용에 맞게 이 범위 안에서 LLM이 알아서 슬라이드 수를 정함

content:
  categories: ["news", "knowledge"]
  topics: []                    # 세부 주제 미정 - 비어있으면 카테고리 안에서 LLM이 자유롭게 선정
  language: "en"                # 게시물 본문 언어 - 더 넓은 시장을 노리기 위해 영어로 작성
  news_feeds:                   # 무료 RSS, 전 세계 대상 최신 AI 뉴스 위주 - 필요하면 자유롭게 추가/삭제
    - "https://hnrss.org/newest?q=AI"
    - "https://techcrunch.com/category/artificial-intelligence/feed/"
    - "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    - "https://venturebeat.com/category/ai/feed/"
    - "https://www.technologyreview.com/topic/artificial-intelligence/feed"
    - "https://export.arxiv.org/rss/cs.AI"
  dedup:
    similarity_threshold: 0.85   # 이 값 이상이면 과거 게시물과 중복으로 간주
    history_window: 30           # 난이도 진행 상황 판단(지식 카테고리)에 참고할 최근 게시물 수
    window_days: 7                # 발행/폐기된 주제라도 이 기간이 지나면 다시 생성될 수 있음
  fixed_hashtags:                # 매 게시물에 고정으로 붙는 태그 - AI 관련 노출이 잘 되는 태그 위주
    - "AI"
    - "ArtificialIntelligence"
    - "MachineLearning"
    - "TechNews"
    - "AINews"
    - "FutureTech"
    - "Innovation"
    - "DeepLearning"
    - "TechTrends"
    - "DataScience"

image:
  text_model: "gpt-5-mini"       # 주제/스크립트 생성용
  embedding_model: "text-embedding-3-small"
  image_model: "gpt-image-1-mini"  # 필요 시 gpt-image-1 / gpt-image-2로 교체
  quality:
    draft_preview: "low"          # 검수용 썸네일 미리보기
    final: "medium"                # 채택 후 실제 업로드용
  thumbnail_style: "TBD"          # 피드 통일용 썸네일 스타일 (색/폰트/레이아웃) - 추후 확정
  font:
    regular: "assets/fonts/IBMPlexSansKR-Regular.ttf"
    bold: "assets/fonts/IBMPlexSansKR-Bold.ttf"
  brand:
    primary_color: "#5B5BD6"        # 피드 통일감을 위한 포인트 색 - 나중에 자유롭게 변경
    overlay_opacity: 160             # 배경 위 텍스트 가독성용 어두운 오버레이 (0~255)
    canvas_size: [1080, 1080]        # 캐러셀은 첫 장 비율에 맞춰 나머지가 크롭되므로 전부 1:1로 통일

review:
  draft_candidates: 3             # 매 회 생성할 예비 게시물 수
