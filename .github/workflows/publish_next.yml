name: 게시

on:
  schedule:
    # config/config.yaml의 posting.times(07/12/18/23시 KST)와 맞춰둔 값.
    # 게시 시간을 바꾸면 이 cron도 같이 수정해야 함.
    - cron: "0 22,3,9,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 초안 생성/검수 폴링/게시 워크플로우가 전부 같은 DB 파일에 git push로 반영하기 때문에,
# 겹쳐 돌면 뒤에 push하는 쪽이 거절당하는 레이스가 생길 수 있다. 하나의 그룹으로 묶어서
# 항상 순서대로(하나씩) 실행되도록 한다.
concurrency:
  group: ainstagram-db-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scripts/publish_next.py
        env:
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

      - name: DB 변경사항 커밋
        run: |
          git config user.name "ainstagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ainstagram.db
          git diff --cached --quiet || git commit -m "chore: 게시 결과 반영"
          git push
