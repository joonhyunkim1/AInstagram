name: 게시

on:
  schedule:
    # config/config.yaml의 posting.times(07/12/18/23시 KST)와 맞춰둔 값.
    # 게시 시간을 바꾸면 이 cron도 같이 수정해야 함.
    - cron: "0 22,3,9,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scripts/publish_next.py
        env:
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: DB 변경사항 커밋
        run: |
          git config user.name "ainstagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ainstagram.db
          git diff --cached --quiet || git commit -m "chore: 게시 결과 반영"
          git push
