name: 검수 폴링

on:
  schedule:
    - cron: "*/10 * * * *"  # 10분마다 - 웹훅이 켜져 있으면 이 실행은 사실상 아무 일도 안 하는 안전장치
  workflow_dispatch:
    inputs:
      telegram_update:
        description: "Cloudflare Worker가 넘겨주는 Telegram Update JSON 문자열 (웹훅 경로에서만 사용)"
        required: false
        default: ""

permissions:
  contents: write

# 초안 생성/검수 폴링/게시 워크플로우가 전부 같은 DB 파일에 git push로 반영하기 때문에,
# 겹쳐 돌면 뒤에 push하는 쪽이 거절당하는 레이스가 생길 수 있다. 하나의 그룹으로 묶어서
# 항상 순서대로(하나씩) 실행되도록 한다.
concurrency:
  group: ainstagram-db-writer
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scripts/poll_reviews.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          TELEGRAM_UPDATE_JSON: ${{ github.event.inputs.telegram_update }}

      - name: DB 변경사항 커밋
        run: |
          git config user.name "ainstagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ainstagram.db
          git diff --cached --quiet || git commit -m "chore: 검수 처리 결과 반영"
          git push
